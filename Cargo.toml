[package]
name = "edge-tts"
version = "0.1.0"
edition = "2021"
description = "Rust port of edge-tts - Microsoft Edge TTS client"
license = "LGPL-3.0-only"
repository = "https://github.com/liiando/edge-tts-rs"
authors = ["Liando"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hex encoding of the Sec-MS-GEC token
hex = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures-util = "0.3"
tokio-stream = "0.1"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"

# Regex for validation
regex = "1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# CLI dependencies (for binary)
clap = { version = "4", features = ["derive"] }
tabled = "0.15"
tracing-subscriber = "0.3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "edge-tts"
path = "src/bin/edge-tts.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"
